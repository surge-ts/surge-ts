[package]
name = "surge-ts-node"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
description = "Node.js binding of the surge-ts compiler API (the native half of the `surge-ts` npm package)."
publish = false

[lib]
crate-type = ["cdylib"]
doctest = false

[dependencies]
# The engine allocates heavily; the CLI's allocator (see surge-ts-cli) instead
# of the platform heap.
mimalloc = "0.1.52"
napi = { version = "3.12", default-features = false, features = ["napi8", "dyn-symbols", "serde-json"] }
napi-derive = "3.6"
serde_json = { version = "1.0.149", features = ["preserve_order"] }
surge-ts = { version = "0.1.0", path = "../surge-ts" }

[build-dependencies]
napi-build = "2.4"
